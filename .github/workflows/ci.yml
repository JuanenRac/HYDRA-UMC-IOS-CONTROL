name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the HYDRA-UMC-SDK contracts for the route check
        run: |
          mkdir -p "$RUNNER_TEMP/hydra-umc-sdk"
          curl -fsSL --retry 3 https://github.com/JuanenRac/HYDRA-UMC-SDK/archive/refs/tags/v0.7.5.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/hydra-umc-sdk"
          echo "HYDRA_UMC_SDK_DIR=$RUNNER_TEMP/hydra-umc-sdk" >> "$GITHUB_ENV"
          echo "HYDRA_UMC_REQUIRE_WORKSPACE=1" >> "$GITHUB_ENV"
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
  ios-build:
    name: Build the iOS app (no signing)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      # The Firebase configuration of the push notifications. The secret only reaches code of this repository that the owner
      # pushed (the main branch and his own pull requests); everywhere else the app is built with push off. Never printed,
      # never uploaded.
      - name: Put the Firebase configuration in place
        id: firebase
        if: ${{ github.actor == github.repository_owner && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::warning::the secret GOOGLE_SERVICE_INFO_PLIST is not set: this build has push off"
            exit 0
          fi
          file=ios/Runner/GoogleService-Info.plist
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "$file"
          plutil -lint "$file" >/dev/null 2>&1 || { echo "::error::the secret is not a property list"; rm -f "$file"; exit 1; }
          bundle="$(plutil -extract BUNDLE_ID raw "$file" 2>/dev/null)" || bundle=""
          [ "$bundle" = "com.hydraumc.hydraUmcControl" ] || { echo "::error::the configuration is not the one of com.hydraumc.hydraUmcControl"; rm -f "$file"; exit 1; }
          echo "configured=yes" >> "$GITHUB_OUTPUT"
      - name: Build for iOS without code signing
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Check the push configuration inside the app
        env:
          CONFIGURED: ${{ steps.firebase.outputs.configured }}
        shell: bash
        run: |
          set -euo pipefail
          inside=build/ios/iphoneos/Runner.app/GoogleService-Info.plist
          if [ "$CONFIGURED" = "yes" ]; then
            test -f "$inside" || { echo "::error::the app was built without the configuration"; exit 1; }
            echo "PUSH_CONFIG=ON"
          else
            test ! -f "$inside" || { echo "::error::the app carries a configuration it should not have"; exit 1; }
            echo "PUSH_CONFIG=OFF"
          fi
      - name: Remove the Firebase configuration
        if: ${{ always() }}
        run: rm -f ios/Runner/GoogleService-Info.plist
